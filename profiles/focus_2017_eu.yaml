id: focus_2017_eu
name: Ford Focus (Mk3 EU) 2017
years: "2015-2018"
notes: >
  Seed addresses for Focus Mk3 facelift EU. Validate on your car — modules that
  do not respond are marked offline. BCM/IPC typically sit on MS-CAN (needs OBDLink MX+).
  CAN IDs are decimal (0x7E0 = 2016).

modules:
  - id: PCM
    name: Powertrain Control Module
    tx_id: 2016   # 0x7E0
    bus: hs
    dids:
      - did: 61840  # 0xF190 VIN
        label: VIN
      - did: 61832  # 0xF188
        label: Software number
      - did: 61836  # 0xF18C
        label: ECU serial number

  - id: ABS
    name: Anti-lock Braking System
    tx_id: 1888   # 0x760
    bus: hs
    dids:
      - did: 61832
        label: Software number

  - id: BCM
    name: Body Control Module
    tx_id: 1830   # 0x726
    bus: ms
    dids:
      - did: 61832
        label: Software number
      - did: 56832  # 0xDE00
        label: As-Built block DE00
        as_built: true
      - did: 56833  # 0xDE01
        label: As-Built block DE01
        as_built: true
      - did: 56834  # 0xDE02
        label: As-Built block DE02
        as_built: true
      - did: 56835  # 0xDE03
        label: As-Built block DE03
        as_built: true
    # Experimental lighting seed — aligned with demo DE00=01 02 03 04…
    # Validate bit positions on your car before writing (verified: false).
    params:
      - id: drl_enable
        label: Daytime running lights
        did: 56832
        byte: 0
        bit: 0
        width: 1
        kind: bool
        verified: false
        notes: "Experimental seed (demo DE00 bit0). Validate before writing."
      - id: cornering_lamps
        label: Cornering lamps
        did: 56832
        byte: 0
        bit: 1
        width: 1
        kind: bool
        verified: false
        notes: "Experimental seed. Validate before writing."
      - id: rear_fog
        label: Rear fog lamp enable
        did: 56832
        byte: 1
        bit: 1
        width: 1
        kind: bool
        verified: false
        notes: "Experimental seed (demo DE00 byte1=0x02 → bit1). Validate before writing."
      - id: approach_light_mode
        label: Approach light mode
        did: 56832
        byte: 2
        bit: 0
        width: 2
        kind: enum
        options:
          - value: 0
            label: Off
          - value: 1
            label: Short
          - value: 2
            label: Medium
          - value: 3
            label: Long
        verified: false
        notes: "Experimental seed (demo DE00 byte2=0x03 → bits0-1=3). Validate before writing."
      - id: courtesy_delay
        label: Courtesy delay (raw)
        did: 56832
        byte: 3
        bit: 0
        width: 4
        kind: uint
        verified: false
        notes: "Experimental seed (demo DE00 byte3=0x04 → low nibble). Validate before writing."

  - id: IPC
    name: Instrument Panel Cluster
    tx_id: 1824   # 0x720
    bus: ms
    dids:
      - did: 61832
        label: Software number
      - did: 56832
        label: As-Built block DE00
        as_built: true

  - id: RCM
    name: Restraints Control Module
    tx_id: 1847   # 0x737
    bus: ms
    dids:
      - did: 61832
        label: Software number

  - id: PAM
    name: Parking Aid Module
    tx_id: 1846   # 0x736
    bus: ms
    dids:
      - did: 61832
        label: Software number

  - id: ACM
    name: Audio Control Module
    tx_id: 1831   # 0x727
    bus: ms
    dids:
      - did: 61832
        label: Software number

  - id: APIM
    name: Accessory Protocol Interface Module (SYNC)
    tx_id: 2000   # 0x7D0
    bus: ms
    dids:
      - did: 61832
        label: Software number
