id: tourneo_connect_2017
name: Ford Tourneo Connect 2017
years: "2014-2018"
notes: >
  Seed addresses for Tourneo/Transit Connect (EU). MS-CAN modules require an
  adapter with Ford MS-CAN support (OBDLink MX+ recommended).
  CAN IDs are decimal (0x7E0 = 2016).

modules:
  - id: PCM
    name: Powertrain Control Module
    tx_id: 2016   # 0x7E0
    bus: hs
    dids:
      - did: 61840  # 0xF190
        label: VIN
      - did: 61832  # 0xF188
        label: Software number
      - did: 61836  # 0xF18C
        label: ECU serial number

  - id: ABS
    name: Anti-lock Braking System
    tx_id: 1888   # 0x760
    bus: hs
    dids:
      - did: 61832
        label: Software number

  - id: BCM
    name: Body Control Module
    tx_id: 1830   # 0x726
    bus: ms
    dids:
      - did: 61832
        label: Software number
      - did: 56832  # 0xDE00
        label: As-Built block DE00
        as_built: true
      - did: 56833
        label: As-Built block DE01
        as_built: true
      - did: 56834
        label: As-Built block DE02
        as_built: true
      - did: 56835
        label: As-Built block DE03
        as_built: true

  - id: IPC
    name: Instrument Panel Cluster
    tx_id: 1824   # 0x720
    bus: ms
    dids:
      - did: 61832
        label: Software number
      - did: 56832
        label: As-Built block DE00
        as_built: true

  - id: EPS
    name: Electronic Power Steering
    tx_id: 1840   # 0x730
    bus: ms
    dids:
      - did: 61832
        label: Software number

  - id: RCM
    name: Restraints Control Module
    tx_id: 1847   # 0x737
    bus: ms
    dids:
      - did: 61832
        label: Software number

  - id: PAM
    name: Parking Aid Module
    tx_id: 1846   # 0x736
    bus: ms
    dids:
      - did: 61832
        label: Software number

  - id: AHCM
    name: Auxiliary Heater Control Module
    tx_id: 2021   # 0x7E5
    bus: ms
    dids:
      - did: 61832
        label: Software number
